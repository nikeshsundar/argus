<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Argus</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="bar" id="bar">
      <div class="row">
        <span class="grip" title="Drag to move"></span>
        <button
          class="chip"
          id="chip"
          type="button"
          data-mode="talk"
          title="Switch between asking and acting"
          aria-label="Switch mode"
        >
          Talk
        </button>
        <input
          id="input"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="What do you want to know?"
        />
        <button id="close" class="close" type="button" title="Close (Esc twice)">×</button>
      </div>

      <div class="thread" id="thread"></div>

      <div class="status" id="status" hidden></div>

      <ul class="options" id="options"></ul>

      <div class="hints">
        <span><kbd>↑</kbd><kbd>↓</kbd> pick</span>
        <span><kbd>Enter</kbd> go</span>
        <span><kbd>Esc</kbd> close</span>
        <span class="hint-agent">type <kbd>/</kbd> for commands · drag to move</span>
      </div>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
