<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Argus</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="bar" id="bar">
      <div class="row">
        <span class="chip" id="chip" data-mode="talk">Talk</span>
        <input
          id="input"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="Ask about your screen, or pick an option below…"
        />
      </div>

      <div class="status" id="status" hidden></div>

      <ul class="options" id="options"></ul>

      <div class="hints">
        <span><kbd>↑</kbd><kbd>↓</kbd> pick</span>
        <span><kbd>Enter</kbd> go</span>
        <span><kbd>Esc</kbd> dismiss</span>
        <span class="hint-agent">type <kbd>/</kbd> for commands</span>
      </div>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
