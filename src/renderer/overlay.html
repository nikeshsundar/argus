<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Argus Agent</title>
    <style>
      /*
       * The overlay borrows the bar's surface language: near-white plates lit
       * from above, pill geometry, and red for the one thing that matters here
       * - that the machine is being driven by something other than the person
       * in front of it.
       */
      :root {
        --agent: rgba(228, 35, 28, 0.92);
        --agent-solid: #e4231c;
        --agent-deep: #b8140e;
        --agent-gloss: linear-gradient(#ff7d72 0%, #e4231c 44%, #cc1810 100%);
        --plate: rgba(250, 250, 251, 0.94);
        --ink: #000;
        --muted: #626262;
        --edge: rgba(0, 0, 0, 0.12);
        --hi: rgba(255, 255, 255, 0.85);
        --teach: #1668d6;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
        letter-spacing: -0.011em;
        -webkit-user-select: none;
        user-select: none;
      }

      /* A border, not a fill - the user must still see what is happening. */
      .frame {
        position: fixed;
        inset: 0;
        border: 3px solid var(--agent);
        box-shadow: inset 0 0 40px rgba(228, 35, 28, 0.16);
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.55;
        }
      }

      .banner {
        position: fixed;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 18px;
        border: 1px solid var(--edge);
        border-radius: 999px;
        background: var(--plate);
        backdrop-filter: blur(20px) saturate(180%);
        color: var(--ink);
        font-size: 13px;
        box-shadow:
          0 12px 32px rgba(0, 0, 0, 0.3),
          inset 0 1px 1px var(--hi),
          inset 0 0 0 1px rgba(255, 255, 255, 0.35);
        white-space: nowrap;
        max-width: 90vw;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--agent-solid);
        box-shadow: 0 0 0 3px rgba(228, 35, 28, 0.16);
        flex: none;
      }

      .step {
        color: var(--muted);
      }

      kbd {
        padding: 1px 6px;
        border: 1px solid var(--edge);
        border-radius: 5px;
        background: linear-gradient(#fff 0%, #e7e7e7 42%, #fbfbfb 100%);
        box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1), inset 0 1px 1px var(--hi);
        color: var(--ink);
        font-family: inherit;
        font-size: 11px;
      }

      /*
       * The pointer marker. The real Windows cursor is still the thing doing the
       * clicking - this only rings it, so it is obvious which movements are the
       * agent's and which are the user's.
       */
      .halo,
      .trail {
        position: fixed;
        top: 0;
        left: 0;
        border-radius: 50%;
        pointer-events: none;
        will-change: transform, opacity;
      }

      .halo {
        width: 38px;
        height: 38px;
        margin: -19px 0 0 -19px;
        border: 2px solid rgba(228, 35, 28, 0.95);
        background: radial-gradient(
          circle,
          rgba(228, 35, 28, 0.28) 0%,
          rgba(228, 35, 28, 0.06) 55%,
          transparent 70%
        );
        box-shadow:
          0 0 18px rgba(228, 35, 28, 0.55),
          inset 0 0 10px rgba(228, 35, 28, 0.35);
        transition: opacity 260ms ease;
      }

      /*
       * Each dot chases the same point with a longer transition than the one
       * before it, so the lag alone draws the tail. Nothing is created or
       * destroyed per frame.
       */
      .trail {
        width: 10px;
        height: 10px;
        margin: -5px 0 0 -5px;
        background: rgba(228, 35, 28, 0.5);
        transition:
          transform 90ms linear,
          opacity 260ms ease;
      }

      .trail.t1 {
        transition-duration: 120ms, 260ms;
        opacity: 0.4;
      }

      .trail.t2 {
        transition-duration: 210ms, 260ms;
        opacity: 0.24;
      }

      .trail.t3 {
        transition-duration: 320ms, 260ms;
        opacity: 0.12;
      }

      /* Set by script once the agent has a position to show. */
      .pointer[hidden] {
        display: none;
      }

      .pointer.idle .halo,
      .pointer.idle .trail {
        opacity: 0.25;
      }

      .ripple {
        position: fixed;
        top: 0;
        left: 0;
        width: 20px;
        height: 20px;
        margin: -10px 0 0 -10px;
        border-radius: 50%;
        border: 2px solid rgba(228, 35, 28, 0.9);
        pointer-events: none;
        animation: ripple 460ms cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
      }

      @keyframes ripple {
        from {
          opacity: 0.9;
          scale: 0.4;
        }
        to {
          opacity: 0;
          scale: 3.4;
        }
      }

      /*
       * Paused: the user reached for the mouse, so the agent stood aside.
       *
       * Grey and still, deliberately. Red pulsing means "this machine is being
       * driven, keep your hands off"; the whole point of pausing is that the
       * opposite is now true, and a frame that still looked alarming would be
       * telling them not to do the thing they just did.
       */
      body[data-paused='true'] .frame {
        border-color: rgba(120, 120, 126, 0.7);
        box-shadow: inset 0 0 40px rgba(120, 120, 126, 0.1);
        animation: none;
      }

      body[data-paused='true'] .dot {
        background: #8a8a8e;
        box-shadow: none;
        animation: none;
      }

      body[data-paused='true'] .pointer,
      body[data-paused='true'] .ripple {
        display: none;
      }

      /* ---- Teach Mode ---------------------------------------------------- */

      /*
       * Blue, not red. Red means the machine is driving itself; here it only
       * points, and the learner keeps the mouse. Same frame, different promise
       * - so it must not look the same.
       */
      body[data-kind='teach'] .frame {
        border-color: rgba(22, 104, 214, 0.9);
        box-shadow: inset 0 0 40px rgba(22, 104, 214, 0.14);
        animation: none;
      }

      body[data-kind='teach'] .dot {
        background: var(--teach);
        box-shadow: 0 0 0 3px rgba(22, 104, 214, 0.16);
      }

      /* The agent's own pointer decoration has no business in a lesson. */
      body[data-kind='teach'] .pointer,
      body[data-kind='teach'] .ripple {
        display: none;
      }

      .ghost {
        position: fixed;
        top: 0;
        left: 0;
        pointer-events: none;
        will-change: transform;
        transition: transform 420ms cubic-bezier(0.22, 0.68, 0.24, 1);
      }

      .ghost[hidden] {
        display: none;
      }

      /* Expanding ring, so the eye finds the pointer before reading anything. */
      .ghost-ping {
        position: absolute;
        left: -26px;
        top: -26px;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        border: 2px solid rgba(22, 104, 214, 0.8);
        animation: ghost-ping 1.8s ease-out infinite;
      }

      @keyframes ghost-ping {
        0% {
          opacity: 0.85;
          scale: 0.45;
        }
        70%,
        100% {
          opacity: 0;
          scale: 1.6;
        }
      }

      .ghost-arrow {
        position: absolute;
        left: -3px;
        top: -3px;
        filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.4));
      }

      .caption {
        position: absolute;
        left: 26px;
        top: 30px;
        width: max-content;
        max-width: 340px;
        padding: 13px 15px;
        border: 1px solid rgba(22, 104, 214, 0.32);
        border-radius: 16px;
        background: var(--plate);
        backdrop-filter: blur(20px) saturate(180%);
        color: var(--ink);
        box-shadow:
          0 16px 40px rgba(0, 0, 0, 0.3),
          inset 0 1px 1px var(--hi);
      }

      /* Near an edge the caption would run off screen, so it swaps sides. */
      .ghost[data-flip-x='true'] .caption {
        left: auto;
        right: 26px;
      }

      .ghost[data-flip-y='true'] .caption {
        top: auto;
        bottom: 30px;
      }

      .caption-step {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--teach);
      }

      .caption-title {
        margin-top: 4px;
        font-size: 14px;
        font-weight: 600;
        line-height: 1.35;
        letter-spacing: -0.018em;
      }

      .caption-detail {
        margin-top: 6px;
        font-size: 12.5px;
        line-height: 1.5;
        color: #3c3c3e;
      }

      .caption-hint {
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid var(--edge);
        font-size: 11.5px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="frame"></div>
    <div class="banner">
      <span class="dot"></span>
      <span id="action">Argus is controlling your PC</span>
      <span class="step" id="step"></span>
      <span class="step">— hold <kbd>Esc</kbd> to stop</span>
    </div>
    <div class="pointer" id="pointer" hidden>
      <div class="trail t3"></div>
      <div class="trail t2"></div>
      <div class="trail t1"></div>
      <div class="halo"></div>
    </div>
    <div class="ghost" id="ghost" hidden>
      <div class="ghost-ping"></div>
      <svg class="ghost-arrow" width="26" height="30" viewBox="0 0 26 30" aria-hidden="true">
        <path
          d="M2 1.5 L2 24 L8.2 18.4 L12.4 27.6 L16.6 25.6 L12.5 16.7 L21 16.2 Z"
          fill="#1668d6"
          stroke="#ffffff"
          stroke-width="1.6"
          stroke-linejoin="round"
        />
      </svg>
      <div class="caption">
        <div class="caption-step" id="caption-step"></div>
        <div class="caption-title" id="caption-title"></div>
        <div class="caption-detail" id="caption-detail"></div>
        <div class="caption-hint" id="caption-hint"></div>
      </div>
    </div>
    <script type="module" src="./src/overlay.ts"></script>
  </body>
</html>
