<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Argus Agent</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }

      /* A border, not a fill - the user must still see what is happening. */
      .frame {
        position: fixed;
        inset: 0;
        border: 3px solid rgba(245, 181, 86, 0.9);
        box-shadow: inset 0 0 40px rgba(245, 181, 86, 0.18);
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.55;
        }
      }

      .banner {
        position: fixed;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 18px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 999px;
        background: rgba(16, 17, 26, 0.92);
        color: #f1f3f8;
        font-size: 13px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
        white-space: nowrap;
        max-width: 90vw;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #f5b556;
        flex: none;
      }

      .step {
        color: #8a90a6;
      }

      kbd {
        padding: 1px 6px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.06);
        font-family: inherit;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div class="frame"></div>
    <div class="banner">
      <span class="dot"></span>
      <span id="action">Argus is controlling your PC</span>
      <span class="step" id="step"></span>
      <span class="step">— hold <kbd>Esc</kbd> to stop</span>
    </div>
    <script type="module" src="./src/overlay.ts"></script>
  </body>
</html>
